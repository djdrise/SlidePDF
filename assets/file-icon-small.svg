<!-- Значок файла для мелких размеров (16–32 px). Надпись «PDF» на 16 пикселях
     занимает восемь точек на три буквы и превращается в грязь, поэтому её
     заменяет сплошная коралловая полоса: силуэт страницы с цветной меткой
     узнаётся мгновенно. Страница крупнее и с меньшим скруглением — на мелком
     размере углы иначе съедаются. -->
