<!-- Знак для мелких размеров иконки (16–32 px). Две карточки вместо трёх и
     смещение крупнее: на 16 пикселях сдвиг третьей карточки меньше пикселя и
     она сливается с соседней. Плитка скруглена слабее — сильное скругление на
     мелком размере съедает углы. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c" />
      <stop offset="1" stop-color="#e0402f" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="170" fill="url(#tile)" />
  <rect x="312" y="302" width="470" height="290" rx="36" fill="#ffffff" opacity=".55" />
  <rect x="242" y="402" width="520" height="320" rx="40" fill="#ffffff" />
</svg>
