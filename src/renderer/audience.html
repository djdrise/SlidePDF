<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob: data:; script-src 'self' file: blob:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' file: data: blob:; worker-src 'self' file: blob:; object-src 'none'; base-uri 'none';" />
    <title>SlidePDF — экран зрителей</title>
    <link rel="stylesheet" href="styles/audience.css" />
  </head>
  <body>
    <div id="bar" class="bar">
      <span class="bar-title">Экран зрителей — превью</span>
      <span class="bar-hint">F5 — показ во весь экран</span>
      <button id="bar-close" class="bar-close" title="Скрыть окно">×</button>
    </div>
    <main id="stage" class="stage"></main>
    <div id="blank" class="blank" hidden></div>
    <div id="hint" class="hint">
      <svg class="mark" viewBox="0 0 48 48" width="72" height="72" aria-hidden="true">
        <rect x="14.86" y="13.92" width="23.44" height="14.06" rx="1.8" fill="#4b515c" />
        <rect x="12.28" y="16.97" width="23.44" height="14.06" rx="1.8" fill="#767d8a" />
        <rect x="9.7" y="20.02" width="23.44" height="14.06" rx="1.8" fill="#e0402f" />
      </svg>
      <h1>SlidePDF</h1>
      <p>Перетащите PDF в это окно или нажмите <kbd>O</kbd></p>
    </div>
    <script type="module" src="audience.js"></script>
  </body>
</html>
